name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test/analysis dependencies
        # The heavy vision deps (mediapipe, ultralytics) are imported lazily and
        # are not needed to run the test suite, which exercises the metrics,
        # the segmenter, and the offline re-segmentation on saved features.
        # Versions are pinned in requirements-dev.txt so CI is reproducible.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff — error-level checks)
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce the reported evaluation from saved features
        # Asserts that re-segmenting the saved per-frame features reproduces
        # the saved boundaries, and regenerates every number quoted in the
        # report. Guards against silent drift in the boundary logic.
        run: python evaluate_extended.py --src . --no-figures

      - name: Check ground-truth annotations are well-formed
        # Structural checks only (monotonic, tiling, coverage). The annotator
        # provenance check is advisory here: it fails until the flagged files
        # are re-annotated, which is tracked in ANNOTATION_PROTOCOL.md §4.
        continue-on-error: true
        run: |
          for f in ground_truth_coolingfan_v2.json ground_truth_cpuplacement.json \
                   ground_truth_raminstallation.json ground_truth_cableconnection.json \
                   ground_truth_installintelcpu.json; do
            echo "--- $f"
            python annotate.py validate --ground-truth "$f" || true
          done
